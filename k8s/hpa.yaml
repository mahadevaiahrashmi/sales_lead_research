# Scale the API on CPU. Needs metrics-server installed on the cluster.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sales-lead-research
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sales-lead-research
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
