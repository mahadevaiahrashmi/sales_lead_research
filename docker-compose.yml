# Run the Sales Lead Research API + web UI locally:
#
#   docker compose up --build
#
# then open http://localhost:8000  (REST API under /api/*, OpenAPI docs at /docs)
#
services:
  web:
    build: .
    image: sales-lead-research:local
    container_name: sales-lead-research
    ports:
      - "8000:8000"
    environment:
      APP_PORT: "8000"
      SALES_DB_PATH: "/app/data/customers.sqlite"
    volumes:
      # Persists the seeded demo database across restarts. The container
      # seeds it automatically on first run.
      - sales-data:/app/data
      #
      # --- To match against YOUR real customer list instead of the demo
      #     data, comment out the named volume above and bind-mount your
      #     own SQLite file (same schema as scripts/init_dummy_db.py):
      #
      #   - ./customers.sqlite:/app/data/customers.sqlite:ro

volumes:
  sales-data:
