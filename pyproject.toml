# agent-notes: { ctx: "Python project metadata and deps", deps: [], state: active, last: "tara@2026-04-15" }
[project]
name = "sales-lead-research"
version = "0.1.0"
description = "CLI chat tool that surfaces SEC EDGAR corporate hierarchies for sales leads"
requires-python = ">=3.12"
dependencies = [
    "rich>=13.7",
]

[project.scripts]
sales-lead-research = "sales_lead_research.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sales_lead_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
